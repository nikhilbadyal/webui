name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.version.outputs.major }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Build this fork's triggering revision, including its rebased custom commits.
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npx eslint src/

      - run: npm run build

      - name: Create webui.zip
        working-directory: dist
        run: zip -r ../webui.zip .

      - name: Build release body
        run: |
          awk '/^## \[/{c++} c==1' CHANGELOG.md > release_body.md

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-zip
          path: webui.zip
          retention-days: 1

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: webui.zip
          body_path: release_body.md
          # Tag-push releases are created as drafts; the `publish` job un-drafts
          # them only after the build succeeds, so watcher notifications don't
          # fire on broken builds.
          draft: true

      - name: Publish commit release
        # Publish every successful main build, including rebased pushes and manual reruns.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Full commit IDs keep releases unique without changing the package version.
          tag="build-$GITHUB_SHA"
          title="Stalwart WebUI $VERSION (${GITHUB_SHA:0:12})"
          {
            printf 'Build of commit %s on this fork.\n\n' "$GITHUB_SHA"
            git log -1 --format=%s
            printf '\n[Workflow run](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > commit_release_body.md

          # Reruns refresh the same commit's asset rather than creating duplicates.
          # The rolling major release retains the Latest badge and stable download URL.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" webui.zip --clobber
          else
            gh release create "$tag" webui.zip --target "$GITHUB_SHA" \
              --title "$title" --notes-file commit_release_body.md --latest=false
          fi

  publish:
    # Distinguish version-tag publication from the per-commit releases in the build job.
    name: Publish version tag release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Un-draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"

  rolling:
    name: Update rolling major release
    needs: [build]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: rolling-v${{ needs.build.outputs.major }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      ROLLING_TAG: v${{ needs.build.outputs.major }}
      ASSET: webui.zip
    steps:
      - uses: actions/checkout@v6
        with:
          # Keep release metadata tied to the exact revision used by the build job.
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Download webui artifact
        uses: actions/download-artifact@v4
        with:
          name: webui-zip

      - name: Move rolling tag
        run: |
          # Create or move the rolling tag (e.g. v2) to point to the latest commit
          if gh api "repos/$GH_REPO/git/ref/tags/$ROLLING_TAG" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$ROLLING_TAG" -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$ROLLING_TAG" -f sha="$GITHUB_SHA" --silent
          fi

      - name: Publish rolling release
        run: |
          title="Stalwart WebUI ${ROLLING_TAG#v}.x"
          notes="Tracks the latest ${ROLLING_TAG#v}.x release build."
          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release edit "$ROLLING_TAG" --title "$title" --notes "$notes" --draft=false --prerelease=false --latest=true
            gh release upload "$ROLLING_TAG" "$ASSET" --clobber
          else
            gh release create "$ROLLING_TAG" "$ASSET" --verify-tag --title "$title" --notes "$notes" --latest=true
          fi

  cleanup:
    name: Cleanup failed release
    needs: [build]
    if: failure() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete draft release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes --cleanup-tag --repo "${{ github.repository }}" || true
